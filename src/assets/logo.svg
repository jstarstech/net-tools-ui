<svg width="900" height="220" viewBox="0 0 900 220" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;600&amp;display=swap');
      .bg-circle  { fill: #e8f4fd; }
      .lens-bg    { fill: #ffffff; }
      .lens-ring  { fill: none; stroke: #2d8cf0; stroke-width: 14; }
      .handle     { stroke: #2d8cf0; stroke-width: 14; stroke-linecap: round; fill: none; }
      .node-main  { fill: #2d8cf0; }
      .node-small { fill: #5ba8f5; }
      .node-accent{ fill: #0a5fc4; }
      .edge       { stroke: #5ba8f5; stroke-width: 4; stroke-linecap: round; opacity: 0.75; fill: none; }
    </style>
  </defs>

  <!-- Icon -->
  <circle cx="110" cy="100" r="95" class="bg-circle"/>
  <circle cx="97"  cy="88"  r="58" class="lens-bg"/>

  <line x1="97"  y1="42"  x2="97"  y2="88"  class="edge"/>
  <line x1="97"  y1="88"  x2="67"  y2="108" class="edge"/>
  <line x1="97"  y1="88"  x2="127" y2="108" class="edge"/>
  <line x1="97"  y1="88"  x2="97"  y2="118" class="edge"/>
  <line x1="67"  y1="108" x2="97"  y2="118" class="edge"/>
  <line x1="127" y1="108" x2="97"  y2="118" class="edge"/>

  <circle cx="97"  cy="42"  r="7"  class="node-accent"/>
  <circle cx="97"  cy="88"  r="10" class="node-main"/>
  <circle cx="67"  cy="108" r="6"  class="node-small"/>
  <circle cx="127" cy="108" r="6"  class="node-small"/>
  <circle cx="97"  cy="118" r="6"  class="node-small"/>

  <circle cx="97"  cy="88"  r="58" class="lens-ring"/>
  <line x1="143" y1="134" x2="178" y2="170" class="handle"/>

  <!-- Wordmark -->
  <text x="230" y="148" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif">
    <tspan font-weight="600" font-size="96" fill="#1a1a2e" letter-spacing="-2">Net</tspan><tspan font-weight="300" font-size="96" fill="#2d8cf0" letter-spacing="-2">Tools</tspan>
  </text>
</svg>
